<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>Madeira - Emiel de Graaf - Landscape Photos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="View the photos">
  <link rel="icon" type="image/png" sizes="32x32" href="../favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>
  <header>
    <a href="../index.html">

      <p>Emiel de Graaf</p>

    <h1>Madeira (2025)</h1>

  <main>
    <div class="photo-grid">
      <div class="photo full">
        <img loading="lazy" src="../shots/madeira/fanal-forest-before-mist.jpg" alt="Fanal Forest">
        <p>Fanal Forest</p>
      </div>

      </div>
      <div class="photo column">
        <img loading="lazy" src="../shots/madeira/fanal-familiy-with-mist.jpg" alt="Family trees before the mist">
        <p>Family trees with mist</p>
      </div>
      <div class="photo portrait">
        <img loading="lazy" src="../shots/madeira/lone-tree.jpg" alt="Lone tree">
        <p>Lone tree</p>
      </div>
      <div class="photo full">
        <img loading="lazy" src="../shots/madeira/framed-trees.jpg" alt="Framed trees">

      </div>

        <p>Grazing cow</p>
      </div>
      <div class="photo full">
        <img loading="lazy" src="../shots/madeira/scaring-the-cow.jpg" alt="Scary tree">
        <p>Scary tree</p>
      </div>
      <div class="photo column">
        <img loading="lazy" src="../shots/madeira/foggy-leafs.jpg" alt="Foggy leafs">
        <p>Foggy leafs</p>
      </div>  
      <div class="photo column">
        <img loading="lazy" src="../shots/madeira/spreading-roots.jpg" alt="Spreading its roots">
        <p>Spreading its roots</p>
      </div>
      <div class="photo full">
        <img loading="lazy" src="../shots/madeira/damping-trees.jpg" alt="Damping trees">
        <p>Damping trees</p>
      </div>
      <div class="photo full">
        <img loading="lazy" src="../shots/madeira/ribeira-de-janela.jpg" alt="Ribeira de Janela">
